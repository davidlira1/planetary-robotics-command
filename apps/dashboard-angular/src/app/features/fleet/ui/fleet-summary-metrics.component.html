<div class="stats">
  <div class="stat">
    <div class="kicker">FLEET ONLINE</div>
    <b>{{ padCount(online()) }}<small>/{{ padCount(total()) }}</small></b>
  </div>
  <div class="stat">
    <div class="kicker">AVG BATTERY</div>
    <b>{{ avgBattery() }}</b>
  </div>
  <div class="stat">
    <div class="kicker">ACTIVE ALERTS</div>
    <b [class.yellow]="alerts.alerts().length > 0">{{ padCount(alerts.alerts().length) }}</b>
  </div>
  <div class="stat">
    <div class="kicker">LAST FLEET LOAD</div>
    <b>{{ formatClock(fleet.loadedAt()) }}</b>
  </div>
</div>
