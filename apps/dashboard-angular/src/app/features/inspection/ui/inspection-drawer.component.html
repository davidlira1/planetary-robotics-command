<aside
  class="drawer"
  [class.open]="open()"
  role="complementary"
  aria-labelledby="inspection-title"
  [inert]="!open()"
  [attr.aria-hidden]="!open()"
>
  <button type="button" class="close" #closeButton (click)="inspection.close()">
    ESC / CLOSE
  </button>
  <div class="kicker">{{ kicker() }}</div>
  <h1 id="inspection-title">{{ title() }}</h1>
  <div class="lead">{{ lead() }}</div>
  <div class="drawergrid">
    @for (card of cards(); track card.label) {
      <div class="card">
        <div class="kicker">{{ card.label }}</div>
        <strong [attr.data-tone]="card.tone">{{ card.value }}</strong>
      </div>
    }
  </div>
</aside>
